name: LaTeX Mathematical Visuals

on:
  push:
    paths:
      - "figures/**/*.tex"
      - ".github/workflows/latex-build.yml"
  pull_request:
    paths:
      - "figures/**/*.tex"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-visuals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile LaTeX and TikZ
        uses: xu-cheng/latex-action@v3
        with:
          root_file: build-visuals.tex
          working_directory: figures

      - name: Upload compiled mathematical visuals
        uses: actions/upload-artifact@v4
        with:
          name: mathematical-visuals-pdf
          path: figures/build-visuals.pdf
