name: IEE574 Problem 2 Exact CairoMakie Render

on:
  push:
    branches:
      - automation/iee574-hw2-julia-render-20260920
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Install CairoMakie and LaTeXStrings
        run: |
          julia -e 'using Pkg; Pkg.activate(".automation/hw2/exact_env"); Pkg.add(["CairoMakie","LaTeXStrings"]); Pkg.precompile()'

      - name: Run exact user code
        run: |
          julia --project=.automation/hw2/exact_env .automation/hw2/problem2_exact.jl

      - name: Verify PDF exists
        run: |
          test -s problem2_S1_S2_graphpaper.pdf
          sha256sum problem2_S1_S2_graphpaper.pdf | tee problem2_sha256.txt
          ls -lh problem2_S1_S2_graphpaper.pdf

      - name: Upload exact rendered PDF
        uses: actions/upload-artifact@v4
        with:
          name: IEE574-Problem2-Exact-CairoMakie
          path: |
            problem2_S1_S2_graphpaper.pdf
            problem2_sha256.txt
          if-no-files-found: error
          retention-days: 7
