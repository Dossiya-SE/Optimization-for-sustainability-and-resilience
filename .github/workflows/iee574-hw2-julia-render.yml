name: IEE574 Problem 2 Final CairoMakie Render

on:
  push:
    branches:
      - automation/iee574-hw2-julia-render-20260920
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'

      - name: Install CairoMakie and LaTeXStrings
        run: |
          julia -e 'using Pkg; Pkg.activate(".automation/hw2/exact_env"); Pkg.add(["CairoMakie","LaTeXStrings"]); Pkg.precompile()'

      - name: Run final Problem 2 code
        run: |
          julia --project=.automation/hw2/exact_env .automation/hw2/problem2_exact.jl

      - name: Verify outputs
        run: |
          test -s IEE574_HW2_Problem2_FINAL.pdf
          test -s IEE574_HW2_Problem2_FINAL.svg
          test -s IEE574_HW2_Problem2_FINAL.png
          sha256sum IEE574_HW2_Problem2_FINAL.pdf | tee problem2_sha256.txt
          ls -lh IEE574_HW2_Problem2_FINAL.*

      - name: Upload final rendered files
        uses: actions/upload-artifact@v4
        with:
          name: IEE574-Problem2-Final-CairoMakie-V2
          path: |
            IEE574_HW2_Problem2_FINAL.pdf
            IEE574_HW2_Problem2_FINAL.svg
            IEE574_HW2_Problem2_FINAL.png
            problem2_sha256.txt
          if-no-files-found: error
          retention-days: 7
