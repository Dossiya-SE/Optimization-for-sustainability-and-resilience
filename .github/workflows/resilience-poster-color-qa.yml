name: Resilience poster semantic color verification
on:
  push:
    paths:
      - '04-resilience/visual-frameworks/coupled-power-transportation-resilience-states/**'
      - '.github/workflows/resilience-poster-color-qa.yml'
  pull_request:
    paths:
      - '04-resilience/visual-frameworks/coupled-power-transportation-resilience-states/**'
      - '.github/workflows/resilience-poster-color-qa.yml'
jobs:
  semantic-artifact-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run poster color and semantic regression
        run: python -m unittest discover -s 04-resilience/visual-frameworks/coupled-power-transportation-resilience-states -p 'test_color_governance.py' -v
